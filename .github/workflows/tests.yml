name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the locked environment
        run: python -m pip install -r requirements.txt
      - name: Run the tests
        run: python -m pytest -q tests test_prescription.py
      - name: Evaluate the three reference designs
        shell: bash
        run: |
          check() {
            python challenge_evaluator.py "examples/$1" --challenge "$2" --output result.json > /dev/null || true
            python -c "import json,sys; a=json.load(open('result.json')); b=json.load(open('validation/$2_evaluation.json')); assert a['status']=='eligible' and a['official'], a['violations']; assert abs(a['score']-b['score'])<=1e-12*b['score'], (a['score'], b['score']); print('$1', a['score'])"
          }
          for c in rms doublet wide_angle; do check "$c.json" "$c"; done
          # Optiland file with automatic real-ray clear radii, widest field
          check wide_angle.noapertures.optiland.json wide_angle
